<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trilha Web</title>
  <meta name="description" content="Trilha de estudos de desenvolvimento web: C# e .NET, JavaScript, TypeScript e Angular, HTML e CSS, e SQL Server. Marque os tópicos estudados e acompanhe seu progresso.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M6 26V6' stroke='%237B4DFF' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M6 16h20' stroke='%231F7AE0' stroke-width='4' stroke-linecap='round'/%3E%3Ccircle cx='6' cy='16' r='5' fill='%23fff' stroke='%2316181D' stroke-width='3'/%3E%3Ccircle cx='26' cy='16' r='5' fill='%23fff' stroke='%2316181D' stroke-width='3'/%3E%3C/svg%3E">

  <!-- Aplica o tema salvo antes de pintar a página, evitando o "piscar" -->
  <script>
    try {
      var t = localStorage.getItem('trilha-web:tema');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,700;1,400&family=Atkinson+Hyperlegible+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

  <header class="topbar">
    <a class="brand" href="#/" aria-label="Trilha Web, página inicial">
      <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M6 26V6" stroke="var(--line-csharp)" stroke-width="4" stroke-linecap="round"/>
        <path d="M6 16h20" stroke="var(--line-sql)" stroke-width="4" stroke-linecap="round"/>
        <circle cx="6" cy="16" r="5" fill="var(--surface)" stroke="var(--ink)" stroke-width="3"/>
        <circle cx="26" cy="16" r="5" fill="var(--surface)" stroke="var(--ink)" stroke-width="3"/>
      </svg>
      <span class="brand__name">Trilha Web</span>
    </a>

    <nav class="topnav" aria-label="Guias" id="topnav"></nav>

    <div class="topbar__actions">
      <span class="overall-pill" id="overall-pill" title="Progresso geral"></span>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Alternar tema">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z"/></svg>
      </button>
    </div>
  </header>

  <main id="conteudo" tabindex="-1">
    <div class="loading" role="status">Carregando os guias…</div>
  </main>

  <dialog class="celebration" id="celebration" aria-labelledby="celebration-title">
    <div class="celebration__body">
      <div class="celebration__badge" aria-hidden="true">
        <svg viewBox="0 0 48 48"><path d="M14 25l7 7 14-15"/></svg>
      </div>
      <h2 id="celebration-title"></h2>
      <p id="celebration-text"></p>
      <div class="celebration__actions">
        <a class="btn btn--primary" id="celebration-next" href="#/"></a>
        <button class="btn btn--ghost" type="button" id="celebration-close">Continuar aqui</button>
      </div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
